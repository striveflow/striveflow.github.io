<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1F17"/>
      <stop offset="100%" stop-color="#091520"/>
    </linearGradient>

    <linearGradient id="markGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#39FF7A"/>
      <stop offset="55%" stop-color="#00E5C0"/>
      <stop offset="100%" stop-color="#00C8FF"/>
    </linearGradient>

    <!-- Same gradient but left-to-right for the F crossbar -->
    <linearGradient id="markGradH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#39FF7A"/>
      <stop offset="100%" stop-color="#00C8FF"/>
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="55" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="iconClip">
      <rect width="1024" height="1024" rx="220" ry="220"/>
    </clipPath>

    <radialGradient id="centerGlow" cx="50%" cy="52%" r="42%">
      <stop offset="0%" stop-color="#00E5C0" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#00E5C0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#iconClip)">
    <!-- Background -->
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#centerGlow)"/>

    <!-- ======= SF LIGATURE MONOGRAM ======= -->
    <!--
      The S and F are drawn as a single connected ligature:
      - The S curves left-to-right through the center
      - The F's vertical stem flows directly off the bottom of the S
      - A flow arrow tip extends upward from the F stem — merging both letters
        into one kinetic mark
    -->

    <!-- Glow layer behind (bloomed) -->
    <g filter="url(#softGlow)" opacity="0.5">
      <!-- S shape -->
      <path d="
        M 580 240
        C 580 240, 360 220, 340 360
        C 320 480, 530 490, 530 510
        C 530 510, 560 520, 560 530
        C 560 610, 360 620, 340 730
        C 320 840, 520 820, 580 800
        "
        fill="none" stroke="#00E5C0" stroke-width="90" stroke-linecap="round"/>

      <!-- F vertical stem (flows from bottom of S) -->
      <line x1="580" y1="530" x2="580" y2="800" stroke="#00E5C0" stroke-width="90" stroke-linecap="round"/>
      <!-- F top bar -->
      <line x1="580" y1="530" x2="740" y2="530" stroke="#00E5C0" stroke-width="90" stroke-linecap="round"/>
      <!-- F mid bar -->
      <line x1="580" y1="640" x2="710" y2="640" stroke="#00E5C0" stroke-width="90" stroke-linecap="round"/>
    </g>

    <!-- ── S path ── -->
    <path d="
      M 580 240
      C 580 240, 360 220, 340 360
      C 320 480, 530 490, 530 510
      C 530 510, 560 520, 560 530
      C 560 610, 360 620, 340 730
      C 320 840, 520 820, 580 800
      "
      fill="none"
      stroke="url(#markGrad)"
      stroke-width="78"
      stroke-linecap="round"
      filter="url(#glow)"
    />

    <!-- ── F vertical stem ── -->
    <line x1="580" y1="530" x2="580" y2="800"
      stroke="url(#markGrad)" stroke-width="78" stroke-linecap="round"
      filter="url(#glow)"/>

    <!-- ── F top crossbar ── -->
    <line x1="580" y1="530" x2="750" y2="530"
      stroke="url(#markGradH)" stroke-width="78" stroke-linecap="round"
      filter="url(#glow)"/>

    <!-- ── F mid crossbar (shorter) ── -->
    <line x1="580" y1="650" x2="710" y2="650"
      stroke="url(#markGradH)" stroke-width="65" stroke-linecap="round"
      filter="url(#glow)" opacity="0.85"/>

    <!-- ── Arrow tip rising from top of S, implying upward flow ── -->
    <!-- Arrow shaft extending upward from top of S -->
    <line x1="580" y1="240" x2="580" y2="155"
      stroke="url(#markGrad)" stroke-width="60" stroke-linecap="round"
      filter="url(#glow)"/>
    <!-- Arrowhead -->
    <path d="M 520 210 L 580 140 L 640 210"
      fill="none" stroke="url(#markGrad)" stroke-width="60"
      stroke-linecap="round" stroke-linejoin="round"
      filter="url(#glow)"/>
  </g>
</svg>
